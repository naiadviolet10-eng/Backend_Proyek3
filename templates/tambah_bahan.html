<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Judul}} - Dapur Cerdas</title>
    <link rel="stylesheet" href="/static/css/tambah_bahan.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <img src="/static/img/logo_dapur_cerdas.png" alt="Logo Dapur Cerdas">
            <div>
                <h1>{{.Judul}}</h1>
                <p>Isi data bahan pangan dan nilai gizinya</p>
            </div>
        </div>

        <a href="/bahan" class="back-button">← Bahan Pangan</a>
    </header>

    <main class="container">
        <form method="POST" action="{{.Action}}">

            <!-- INFO DASAR -->
            <section class="form-card">
                <h3>Info Dasar</h3>
                <div class="form-grid">
                    <div class="field span-2">
                        <label for="nama_bahan">Nama Bahan</label>
                        <input type="text" id="nama_bahan" name="nama_bahan"
                               value="{{.Bahan.NamaBahan}}"
                               placeholder="Contoh: Telur Ayam" maxlength="100" required>
                    </div>

                    <div class="field">
                        <label for="kategori_id">Kategori</label>
                        <select id="kategori_id" name="kategori_id" required>
                            <option value="">Pilih kategori</option>
                            {{range .DaftarKategori}}
                            <option value="{{.ID}}" {{if eq .ID $.Bahan.KategoriID}}selected{{end}}>{{.Nama}}</option>
                            {{end}}
                        </select>
                    </div>

                    <div class="field">
                        <label for="satuan">Satuan</label>
                        <input type="text" id="satuan" name="satuan"
                               value="{{.Bahan.Satuan}}"
                               placeholder="butir, sdm, potong" maxlength="20" required>
                    </div>
                </div>
            </section>

            <!-- MAKRONUTRIEN -->
            <section class="form-card">
                <h3>Makronutrien <span class="hint">per 100 g</span></h3>
                <div class="form-grid">
                    <div class="field">
                        <label for="kalori">Kalori (kkal)</label>
                        <input type="number" id="kalori" name="kalori" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.Kalori}}">
                    </div>
                    <div class="field">
                        <label for="protein">Protein (g)</label>
                        <input type="number" id="protein" name="protein" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.Protein}}">
                    </div>
                    <div class="field">
                        <label for="lemak">Lemak (g)</label>
                        <input type="number" id="lemak" name="lemak" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.Lemak}}">
                    </div>
                    <div class="field">
                        <label for="karbohidrat">Karbohidrat (g)</label>
                        <input type="number" id="karbohidrat" name="karbohidrat" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.Karbohidrat}}">
                    </div>
                </div>
            </section>

            <!-- MINERAL & VITAMIN -->
            <section class="form-card">
                <h3>Mineral &amp; Vitamin <span class="hint">per 100 g</span></h3>
                <div class="form-grid">
                    <div class="field">
                        <label for="zat_besi">Zat Besi (mg)</label>
                        <input type="number" id="zat_besi" name="zat_besi" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.ZatBesi}}">
                    </div>
                    <div class="field">
                        <label for="seng">Seng (mg)</label>
                        <input type="number" id="seng" name="seng" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.Seng}}">
                    </div>
                    <div class="field">
                        <label for="vitamin_a">Vitamin A (mcg)</label>
                        <input type="number" id="vitamin_a" name="vitamin_a" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.VitaminA}}">
                    </div>
                    <div class="field">
                        <label for="vitamin_c">Vitamin C (mg)</label>
                        <input type="number" id="vitamin_c" name="vitamin_c" step="any" min="0" max="9999.99"
                               value="{{angka .Bahan.VitaminC}}">
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <a href="/bahan" class="btn-batal">Batal</a>
                <button type="submit" class="btn-simpan">Simpan Bahan</button>
            </div>

        </form>
    </main>

</body>
</html>
